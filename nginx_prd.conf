# worker_processes 4;
# events{
#   use epoll;
#   worker_connections 65535;
# }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# prd
upstream apis{
  ip_hash;
  server 10.10.2.4:21021;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_max_body_size 100M; # 允许最大100MB上传，可设 500M/1G
  client_body_buffer_size 128k;
  client_body_timeout 300s;
  send_timeout 300s;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/javascript application/json application/manifest+json application/rss+xml application/vnd.ms-fontobject application/wasm application/x-font-ttf application/xml font/ttf font/otf image/svg+xml text/css text/javascript text/plain text/xml;

  # 解决 iframe 跨域问题
  proxy_hide_header X-Frame-Options;

  location / {
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # index.html 不缓存
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # 静态资源强缓存
  location ~* ^/.*\.(js|css|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot|ico)$ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
  }

  location /apis/ {
    proxy_pass   http://apis/;

    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    charset utf-8;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 512k;
  }
}
